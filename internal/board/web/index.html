<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Tasks</title>
<link rel="icon" href="/-/static/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/-/static/vendor/xterm.css">
<link rel="stylesheet" href="/-/static/board.css">
<script src="/-/static/vendor/xterm.js" defer></script>
<script src="/-/static/vendor/addon-unicode11.js" defer></script>
<script src="/-/static/keymap.js" defer></script>
<script src="/-/static/search.js" defer></script>
<script src="/-/static/term.js" defer></script>
<script src="/-/static/app.js" defer></script>
</head>
<body>
<header class="top">
  <button id="side-open" class="side-toggle" type="button" aria-label="Workspaces" aria-controls="side" aria-expanded="false" hidden>☰</button>
  <h1 class="brand">Tasks</h1>
  <a id="session-name" class="session-name" href="/" title="All sessions" hidden></a>
  <span id="stale" class="badge stale" title="herdr didn't answer the last read. This is what it showed before." hidden>stale</span>
  <div id="slack-bar" class="slack-bar" hidden>
    <span id="slack" class="slack-line"></span>
  </div>
  <div class="top-end">
    <input id="search" class="search" type="search" placeholder="Search tasks" aria-label="Search tasks" aria-keyshortcuts="/" title="Search the tasks' names, panes, recaps and notes (/)" autocomplete="off" spellcheck="false" hidden>
    <button id="prio-only" class="prio-only" type="button" aria-pressed="false" title="Show only the priority tasks" hidden><span class="bang" aria-hidden="true">!</span>Priority only</button>
    <button id="latest" class="latest" type="button" aria-pressed="false" title="List the tasks by Claude’s latest reply, with those where an agent asks you something first, then those it works on" hidden>Latest reply</button>
    <button id="assistant-open" class="assistant-open" type="button" aria-controls="assistant" aria-expanded="false" title="A Claude session that knows every task here, and can change them when you ask" hidden>Assistant</button>
    <span id="tailnet" class="tailnet-line" hidden></span>
    <span id="conn" class="conn" role="status"></span>
    <span id="version" class="version"></span>
  </div>
</header>
<div class="page">
<nav id="side" class="side" aria-label="Workspaces" hidden>
  <div class="side-head">
    <button id="side-all" class="side-all" type="button" aria-pressed="true" title="Show every workspace">All</button>
    <button id="side-fold" class="side-fold" type="button" aria-label="Workspaces" aria-controls="side-spaces" aria-expanded="true">«</button>
  </div>
  <div id="side-spaces" class="side-spaces"></div>
</nav>
<div class="main">
<p id="hint" class="hint" hidden>Add a Linear API key to see issue status: <code>herdr-tasks linear-key</code></p>
<main id="board" class="board" hidden></main>
<section id="results" class="results" aria-label="Search results" hidden>
  <p id="results-count" class="results-count" role="status"></p>
  <div id="results-groups" class="result-groups"></div>
</section>
<ul id="session-list" class="session-list" hidden></ul>
<section id="empty" class="empty" aria-live="polite">
  <p id="empty-text" class="empty-text">Connecting…</p>
</section>

<section id="view" class="view" aria-labelledby="detail-title" hidden>
  <div class="view-head">
    <button id="view-back" class="button back" type="button" title="Back to the board (Esc)"><span aria-hidden="true">←</span> Back</button>
    <h2 id="detail-title" class="view-title"></h2>
    <button id="view-layout" class="button view-layout" type="button" aria-pressed="false">
      <svg class="layout-icon" viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="11" rx="1.5"/><path d="M1.5 9h13"/></svg>
      Details below
    </button>
  </div>
  <div class="view-body">
    <div id="terms" class="terms" role="region" aria-label="Terminals"></div>
    <aside id="detail-body" class="panel" aria-label="Task"></aside>
  </div>
</section>
</div>
<aside id="assistant" class="assistant" aria-labelledby="assistant-title" hidden>
  <div class="assistant-head">
    <h2 id="assistant-title" class="assistant-title">Assistant</h2>
    <span id="assistant-status" class="assistant-status"></span>
    <button id="assistant-start" class="button" type="button" title="Start the assistant's Claude" hidden>Start</button>
    <button id="assistant-wide" class="button assistant-widen" type="button" aria-pressed="false">Wider</button>
    <button id="assistant-close" class="button assistant-close" type="button" aria-label="Close the assistant" title="Close (Esc)">×</button>
  </div>
  <div id="assistant-terms" class="terms" role="region" aria-label="The assistant's terminal"></div>
</aside>
</div>

<div id="menu" class="menu" role="menu" aria-label="Move to" hidden></div>

<dialog id="reason" class="sheet" aria-labelledby="reason-title">
  <form id="reason-form" class="sheet-body">
    <h2 id="reason-title" class="sheet-title">In review</h2>
    <p id="reason-task" class="sheet-task"></p>
    <label id="reason-label" class="field-label" for="reason-text">Waiting for</label>
    <input id="reason-text" class="field" type="text" autocomplete="off" spellcheck="false" maxlength="300">
    <div class="sheet-buttons">
      <button id="reason-cancel" class="button" type="button">Cancel</button>
      <button class="button primary" type="submit">Save</button>
    </div>
  </form>
</dialog>

<div id="toasts" class="toasts" role="status" aria-live="polite"></div>
</body>
</html>
