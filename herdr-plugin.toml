id = "herdr-tasks"
name = "Tasks"
version = "0.5.0"
min_herdr_version = "0.8.0"
description = "Task stages, notes, and links on herdr tabs, with an overview across all spaces."
platforms = ["linux", "macos"]

[[build]]
command = ["go", "build", "-o", "bin/herdr-tasks", "./cmd/herdr-tasks"]

# Puts herdr-tasks on PATH, adds ctrl+b t, ctrl+b i, the tab bar status, and
# sidebar rows to herdr's config in a marked block, and syncs running
# sessions (adding a strip to every tab).
[[build]]
command = ["sh", "-c", "./bin/herdr-tasks setup"]

[[startup]]
command = ["bin/herdr-tasks", "hook"]

[[actions]]
id = "overview"
title = "Task overview"
command = ["bin/herdr-tasks", "open"]

[[actions]]
id = "strip"
title = "Show or hide the task strip"
command = ["bin/herdr-tasks", "strip-toggle"]

[[actions]]
id = "sidebar"
title = "Sidebar: tasks or counts"
command = ["bin/herdr-tasks", "sidebar-toggle"]

[[actions]]
id = "sync"
title = "Redo task markers and counts"
command = ["bin/herdr-tasks", "sync"]

[[events]]
on = "tab.created"
command = ["bin/herdr-tasks", "hook"]

[[events]]
on = "tab.closed"
command = ["bin/herdr-tasks", "hook"]

[[events]]
on = "tab.renamed"
command = ["bin/herdr-tasks", "hook"]

[[events]]
on = "tab.moved"
command = ["bin/herdr-tasks", "hook"]

[[events]]
on = "pane.agent_status_changed"
command = ["bin/herdr-tasks", "hook"]

[[events]]
on = "pane.closed"
command = ["bin/herdr-tasks", "hook"]

[[events]]
on = "workspace.created"
command = ["bin/herdr-tasks", "hook"]

[[events]]
on = "workspace.closed"
command = ["bin/herdr-tasks", "hook"]

[[events]]
on = "workspace.renamed"
command = ["bin/herdr-tasks", "hook"]

[[panes]]
id = "overview"
title = "Tasks"
placement = "popup"
width = "92%"
height = "88%"
# Pane commands are looked up on PATH rather than in the plugin folder.
command = ["sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/bin/herdr-tasks\" overview"]
